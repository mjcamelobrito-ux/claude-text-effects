<!doctype html>
<html lang="en" data-resolution="portrait" data-composition-variables='[{"id": "footageSrc", "type": "string", "label": "Talking-head footage (path in assets/)", "default": "assets/speaker-moody.mp4"}, {"id": "clipA", "type": "color", "label": "Timeline clip colour A", "default": "#2533c9"}, {"id": "clipB", "type": "color", "label": "Timeline clip colour B", "default": "#c2410c"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>05 Frame-Rhythm Hook</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b0b; }
      #bg { position: absolute; inset: 0; background: #0b0b0b; z-index: 0; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="9.2" data-width="1080" data-height="1920">
      <div id="bg"></div>
      <video id="footage" class="clip" src="assets/speaker-moody.mp4" data-var-src="footageSrc" muted playsinline
        data-start="0" data-duration="9.2" data-track-index="1"
        style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;z-index:1"></video>
      <div id="fr1" data-composition-id="fr1" data-composition-src="compositions/fr1.html"
        data-start="0" data-duration="2.2" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="fr2" data-composition-id="fr2" data-composition-src="compositions/fr2.html"
        data-start="2.2" data-duration="1.8" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:11"></div>
      <div id="fr3" data-composition-id="fr3" data-composition-src="compositions/fr3.html"
        data-start="4" data-duration="3" data-track-index="4" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:12"></div>
      <div id="fr4" data-composition-id="fr4" data-composition-src="compositions/fr4.html"
        data-start="7" data-duration="2.2" data-track-index="5" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:13"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
