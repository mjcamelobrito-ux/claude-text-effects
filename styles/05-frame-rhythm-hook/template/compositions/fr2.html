<template>
  <style>
    #fr2 { position: absolute; inset: 0; overflow: hidden; }
    /* B-roll burst: full-frame inserts held for 8, 3, 3, 4, 5 frames (30 fps), then a white card hold */
    .fr2-cut { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
    .fr2-cut img { position: absolute; }
    #fr2-k1 { background: radial-gradient(circle at 60% 30%, #6a3bff, #120a2a 70%); }
    #fr2-k2 { background: #101010; }
    #fr2-k3 { background: radial-gradient(circle at 40% 60%, #444, #0a0a0a 70%); }
    #fr2-k4 { background: #f2f2f2; }
    #fr2-k5 { background: radial-gradient(circle at 50% 40%, #2f2f2f, #050505 75%); }
    #fr2-card { background: #f4f4f4; }
    #fr2-photo { position: absolute; left: 290px; top: 560px; width: 500px; height: 680px; border-radius: 4px; overflow: hidden; background: #cfcfcf; }
    #fr2-photo img { left: 25px; top: 120px; width: 450px; height: 600px; }
    #fr2-label { position: absolute; left: 0; right: 0; top: 1300px; text-align: center; font: 700 64px Poppins, sans-serif; color: #111; }
    .fr2-big { position: absolute; left: 0; right: 0; top: 820px; text-align: center; font: 700 120px Poppins, sans-serif; color: #fff; }
  </style>
  <div id="fr2" data-composition-id="fr2" data-width="1080" data-height="1920">
    <div id="fr2-k1" class="fr2-cut"><img src="assets/subject-cutout.png" alt="" style="left:240px;top:600px;width:600px;height:800px" /></div>
    <div id="fr2-k2" class="fr2-cut"><div class="fr2-big">01</div></div>
    <div id="fr2-k3" class="fr2-cut"><img src="assets/object-sphere.png" alt="" style="left:140px;top:560px;width:800px;height:800px" /></div>
    <div id="fr2-k4" class="fr2-cut"><div class="fr2-big" style="color:#111">02 · 03</div></div>
    <div id="fr2-k5" class="fr2-cut"><img src="assets/subject-cutout.png" alt="" style="left:90px;top:300px;width:900px;height:1200px" /></div>
    <div id="fr2-card" class="fr2-cut"><div id="fr2-photo"><img src="assets/subject-cutout.png" alt="" /></div><div id="fr2-label">lorem</div></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const f = 1 / 30;
    // frame-exact cut list: [selector, length in frames]
    const cuts = [["#fr2-k1", 8], ["#fr2-k2", 3], ["#fr2-k3", 3], ["#fr2-k4", 4], ["#fr2-k5", 5], ["#fr2-card", 30]];
    let t = 0;
    cuts.forEach(([s, n]) => { tl.set(s, { opacity: 1 }, t); t += n * f; tl.set(s, { opacity: 0 }, t); });
    // micro push-in on each insert so even 3-frame shots feel alive
    tl.fromTo("#fr2-k1 img", { scale: 1 }, { scale: 1.08, duration: 8 * f, ease: "none" }, 0);
    tl.fromTo("#fr2-k5 img", { scale: 1.15 }, { scale: 1, duration: 5 * f, ease: "none" }, 18 * f);
    tl.fromTo("#fr2-photo", { scale: 0.85 }, { scale: 1, duration: 0.5, ease: "expo.out" }, 23 * f);
    window.__timelines["fr2"] = tl;
  </script>
</template>
