<template>
  <style>
    #sa2 { position: absolute; inset: 0; overflow: hidden; background: #2a1a12; }
    .sa-shot { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
    .sa-shot img { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    #sa2-glow { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(255,214,150,.25), rgba(0,0,0,.35) 85%); }
    /* "heavenly" dip: warm white bloom used at the emotional turn */
    #sa2-bloom { position: absolute; inset: 0; background: radial-gradient(circle at 50% 35%, #fff6e0, #ffd99a 60%, rgba(255,200,120,0)); opacity: 0; }
  </style>
  <div id="sa2" data-composition-id="sa2" data-width="1080" data-height="1920">
    <div id="sa2-s4" class="sa-shot"><img src="assets/shot-4.jpg" alt="" /></div>
    <div id="sa2-s5" class="sa-shot"><img src="assets/shot-5.jpg" alt="" /></div>
    <div id="sa2-s6" class="sa-shot"><img src="assets/shot-6.jpg" alt="" /></div>
    <div id="sa2-glow"></div>
    <div id="sa2-bloom"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const shots = [["#sa2-s4", 0, 1.6, "in"], ["#sa2-s5", 1.6, 1.6, "in"], ["#sa2-s6", 3.2, 1.6, "out"]];
    shots.forEach(([s, a, d, m]) => {
      tl.set(s, { opacity: 1 }, a);
      tl.fromTo(s + " img", m === "in" ? { scale: 1 } : { scale: 1.12 }, { scale: m === "in" ? 1.1 : 1, duration: d, ease: "none" }, a);
      tl.set(s, { opacity: 0 }, a + d);
    });
    // bloom flash bridging shot 5 → 6
    tl.fromTo("#sa2-bloom", { opacity: 0 }, { opacity: 0.95, duration: 0.25, ease: "sine.in" }, 3.0);
    tl.to("#sa2-bloom", { opacity: 0, duration: 0.5, ease: "sine.out" }, 3.25);
    window.__timelines["sa2"] = tl;
  </script>
</template>
