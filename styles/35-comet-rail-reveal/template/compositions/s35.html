<template>
  <style>
    #s35 { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(ellipse 90% 55% at 50% 50%, #1a2a9a 0%, #0a1250 55%, var(--c4, #050824) 100%); }
    #s35 svg { position: absolute; left: 0; top: 0; overflow: visible; }
    #s35 .ln { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; font: 700 92px/1 Inter, sans-serif; color: #fff; letter-spacing: -0.02em; }
  </style>
  <div id="s35" data-composition-id="s35" data-width="1080" data-height="1920">
    <svg width="1080" height="1920" viewBox="0 0 1080 1920">
      <defs>
        <linearGradient id="s35-g" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="980" y2="0">
          <stop offset="0" style="stop-color: var(--c1, #ff5fc8)"/><stop offset=".5" style="stop-color: #8a5bff"/><stop offset="1" style="stop-color: var(--c2, #9fe0ff)"/>
        </linearGradient>
        <filter id="s35-gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="s35-head" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="16"/></filter>
      </defs>
      <!-- the comet's route: under line 1 left -> right, U-turn, under line 2 right -> left -->
      <path id="s35-path" d="M 60 900 L 900 900 C 1060 900 1060 1140 900 1140 L 180 1140" fill="none" stroke="url(#s35-g)" stroke-width="7" stroke-linecap="round" filter="url(#s35-gl)"/>
      <circle id="s35-glow" r="40" fill="#fff6c8" filter="url(#s35-head)"/>
      <circle id="s35-core" r="11" fill="#ffffff"/>
    </svg>
    <div class="ln" id="s35-l1" style="top:800px">lorem ipsum dolor</div>
    <div class="ln" id="s35-l2" style="top:1040px">sit amet elit</div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // A comet streaks along an S-route under two lines of text; each line is revealed right behind the comet,
    // and the comet leaves a glowing gradient rail. Then the rail retracts and the lines fade out.
    const path = document.getElementById("s35-path"), L = path.getTotalLength(), core = document.getElementById("s35-core"), glow = document.getElementById("s35-glow");
    const l1 = document.getElementById("s35-l1"), l2 = document.getElementById("s35-l2"), st = { p: 0, back: 0 };
    path.style.strokeDasharray = L;
    function render() {
      const q = path.getPointAtLength(st.p * L);
      [core, glow].forEach(c => { c.setAttribute("cx", q.x.toFixed(1)); c.setAttribute("cy", q.y.toFixed(1)); });
      const on = st.p > 0.001 && st.p < 0.999; core.setAttribute("opacity", on ? 1 : 0); glow.setAttribute("opacity", on ? 0.9 : 0);
      path.style.strokeDashoffset = (L * (1 - st.p) - st.back * L).toFixed(1);
      // reveal: line 1 up to the comet's x while it is on the first straight; line 2 from the right
      const seg1 = 840 / L, x = q.x;
      const r1 = st.p < seg1 ? x : 1080, r2 = st.p < seg1 + 0.2 ? 1080 : x;
      l1.style.clipPath = `inset(-20px ${(1080 - r1).toFixed(1)}px -20px 0px)`;
      l2.style.clipPath = st.p < seg1 + 0.2 ? "inset(-20px 0px -20px 1080px)" : `inset(-20px 0px -20px ${r2.toFixed(1)}px)`;
    }
    tl.fromTo(st, { p: 0 }, { p: 1, duration: 2.6, ease: "power1.inOut", onUpdate: render }, 0.3);
    tl.fromTo(st, { back: 0 }, { back: 1, duration: 0.8, ease: "power2.in", onUpdate: render }, 4.6);
    tl.to([l1, l2], { opacity: 0, y: -30, duration: 0.5, stagger: 0.1, ease: "power2.in" }, 5.2);
    window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {}; window.__hf.buildReady["s35"] = Promise.resolve().then(render);
    window.__timelines["s35"] = tl;
  </script>
</template>
