<template>
  <style>
    #es1 { position: absolute; inset: 0; overflow: hidden; perspective: 1400px;
      background: radial-gradient(ellipse 80% 60% at 50% 45%, var(--stageLight, #241a5e) 0%, var(--stageDeep, #07051a) 100%); }
    #es1-stack { position: absolute; left: 0; top: 820px; width: 1080px; height: 260px; transform-style: preserve-3d; }
    /* 12 copies of the word: outline-only echoes fading pink → cobalt behind one solid lime front copy */
    #es1 .e { position: absolute; left: 0; top: 0; width: 1080px; text-align: center; font: 400 230px/260px "Archivo Black", sans-serif; letter-spacing: -0.04em;
      color: transparent; -webkit-text-stroke: 3px var(--echo, #ff5fc8); }
    #es1 .solid { color: var(--c1, #c8ff3c); -webkit-text-stroke: 0; text-shadow: 0 10px 30px rgba(0,0,0,.45); }
    #es1-sub { position: absolute; left: 0; width: 1080px; top: 1120px; text-align: center; font: 700 44px Inter, sans-serif; letter-spacing: .3em; color: #fff; }
  </style>
  <div id="es1" data-composition-id="es1" data-width="1080" data-height="1920">
    <!-- Edit the word in every copy (es1-e0 is the solid front one); the small line below is #es1-sub -->
    <div id="es1-stack" data-layout-allow-overlap>
      <div id="es1-e0" class="e solid">LOREM</div>
      <div id="es1-e1" class="e">LOREM</div>
      <div id="es1-e2" class="e">LOREM</div>
      <div id="es1-e3" class="e">LOREM</div>
      <div id="es1-e4" class="e">LOREM</div>
      <div id="es1-e5" class="e">LOREM</div>
      <div id="es1-e6" class="e">LOREM</div>
      <div id="es1-e7" class="e">LOREM</div>
      <div id="es1-e8" class="e">LOREM</div>
      <div id="es1-e9" class="e">LOREM</div>
      <div id="es1-e10" class="e">LOREM</div>
      <div id="es1-e11" class="e">LOREM</div>
    </div>
    <div id="es1-sub">IPSUM DOLOR</div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const N = 12, E = [...Array(N).keys()].map(i => "#es1-e" + i);
    // echoes get progressively deeper, further down-right and cooler; set the colour ramp once
    E.forEach((s, i) => { if (i) tl.set(s, { webkitTextStrokeColor: gsap.utils.interpolate("#ff5fc8", "#2f55ff", i / (N - 1)), opacity: 1 - i * 0.06 }, 0); });
    // STACK IN: copies fly out of the distance one after another, from the back of the stack forward
    E.slice().reverse().forEach((s, k) => { const i = N - 1 - k;
      tl.fromTo(s, { z: -2200, x: 0, y: 0, opacity: 0 }, { z: -i * 46, x: i * 9, y: i * 7, opacity: i ? 1 - i * 0.06 : 1, duration: 0.5, ease: "expo.out" }, 0.0 + k * 0.06); });
    // ORBIT: the camera swings round so the depth of the stack reads
    tl.fromTo("#es1-stack", { rotationY: 30, rotationX: 10 }, { rotationY: -30, rotationX: -6, duration: 2.1, ease: "sine.inOut" }, 0.2);
    tl.fromTo("#es1-sub", { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 1.0);
    // COLLAPSE: every echo snaps into the front copy (one solid word), with a punch
    tl.to(E.slice(1), { z: 0, x: 0, y: 0, duration: 0.3, stagger: 0.015, ease: "power4.in" }, 2.35);
    tl.to("#es1-stack", { rotationY: 0, rotationX: 0, duration: 0.3, ease: "power3.out" }, 2.35);
    tl.to(E.slice(1), { opacity: 0, duration: 0.05 }, 2.7);
    tl.fromTo(E[0], { scale: 1 }, { keyframes: [{ scale: 1.12, duration: 0.08 }, { scale: 1, duration: 0.25, ease: "back.out(3)" }] }, 2.68);
    // EXIT: the echoes burst back out toward the camera and the word goes with them
    tl.set(E.slice(1), { opacity: 0.7 }, 3.2);
    tl.to(E, { z: (i) => 300 + i * 120, opacity: 0, duration: 0.35, stagger: 0.02, ease: "power2.in" }, 3.2);
    tl.to("#es1-sub", { opacity: 0, duration: 0.2 }, 3.2);
    window.__timelines["es1"] = tl;
  </script>
</template>
