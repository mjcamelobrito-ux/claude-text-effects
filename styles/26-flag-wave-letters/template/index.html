<!doctype html>
<html lang="en" data-resolution="portrait" data-composition-variables='[{"id": "footageSrc", "type": "string", "label": "Talking-head footage (path in assets/)", "default": "assets/speaker-warm.mp4"}, {"id": "c1", "type": "color", "label": "Letter colour (lime)", "default": "#c8ff3c"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>26 Flag Wave Letters</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #111; }
      #bg { position: absolute; inset: 0; background: #111; z-index: 0; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="3.8" data-width="1080" data-height="1920">
      <div id="bg"></div>
      <video id="footage" class="clip" src="assets/speaker-warm.mp4" data-var-src="footageSrc" muted playsinline
        data-start="0" data-duration="3.8" data-track-index="1"
        style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;z-index:1"></video>
      <div id="fw1" data-composition-id="fw1" data-composition-src="compositions/fw1.html"
        data-start="0" data-duration="3.8" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:10"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
