<template>
  <style>
    @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("assets/fonts/instrument-serif-italic.woff2") format("woff2"); }
    #eh3 { position: absolute; inset: 0; overflow: hidden; background: var(--paperTone, #e3ded3) url("assets/paper.jpg") center/cover; color: var(--ink, #141414); }
    #eh3-eye { position: absolute; left: 140px; top: 1180px; width: 800px; height: 800px; }
    #eh3-wrap { position: absolute; left: 0; right: 0; top: 820px; text-align: center; }
    .eh3-layer { position: absolute; left: 0; right: 0; top: 0; }
    .eh3-a { font-family: Poppins, sans-serif; font-weight: 700; font-size: 150px; line-height: 1; letter-spacing: -0.03em; }
    .eh3-b { font-family: "Instrument Serif", serif; font-style: italic; font-size: 140px; line-height: .8; }
    #eh3-r { color: #ff2a2a; mix-blend-mode: multiply; }
    #eh3-c { color: #00b7ff; mix-blend-mode: multiply; }
    .eh3-slice { position: absolute; left: 0; width: 1080px; background: #141414; }
    #eh3-s1 { top: 760px; height: 26px; }
    #eh3-s2 { top: 1040px; height: 14px; background: #00b7ff; }
    #eh3-s3 { top: 1300px; height: 60px; background: #f2a43a; }
  </style>
  <div id="eh3" data-composition-id="eh3" data-width="1080" data-height="1920">
    <img id="eh3-eye" src="assets/eye.svg" alt="" data-layout-ignore />
    <div id="eh3-wrap" data-layout-allow-overlap>
      <div id="eh3-r" class="eh3-layer"><div class="eh3-a">lorem</div><div class="eh3-b">ipsum</div></div>
      <div id="eh3-c" class="eh3-layer"><div class="eh3-a">lorem</div><div class="eh3-b">ipsum</div></div>
      <div id="eh3-k" class="eh3-layer"><div class="eh3-a">lorem</div><div class="eh3-b">ipsum</div></div>
    </div>
    <div id="eh3-s1" class="eh3-slice"></div><div id="eh3-s2" class="eh3-slice"></div><div id="eh3-s3" class="eh3-slice"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#eh3-k", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 0);
    tl.fromTo("#eh3-eye", { y: 200 }, { y: 0, duration: 0.5, ease: "expo.out" }, 0);
    // RGB-split glitch: offset colour copies + jittering slices, stepped (no tweening between states)
    const jit = [[0.55, 18, -12], [0.62, -26, 10], [0.69, 34, -20], [0.76, -10, 30], [0.83, 40, -36], [0.9, -48, 22], [0.97, 60, -50]];
    jit.forEach(([t, r, c]) => {
      tl.set("#eh3-r", { x: r, opacity: 1 }, t);
      tl.set("#eh3-c", { x: c, opacity: 1 }, t);
      tl.set("#eh3-k", { x: -r / 3, skewX: r / 4 }, t);
      tl.set(".eh3-slice", { opacity: 1, x: r * 4 }, t);
      tl.set("#eh3-eye", { x: c * 2 }, t);
    });
    tl.fromTo(".eh3-slice", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
    tl.fromTo(["#eh3-r", "#eh3-c"], { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
    // smash to paper white
    tl.to("#eh3-wrap, #eh3-eye, .eh3-slice", { opacity: 0, duration: 0.08 }, 1.48);
    window.__timelines["eh3"] = tl;
  </script>
</template>
