  <script>
    const tl = gsap.timeline({ paused: true });
    // Small, clean title on a deep bokeh stage. On each beat a white shard slices across the frame, the camera punches into

    const T = [...document.querySelectorAll("#s49 .tx")], cam = "#s49 .cam", shard = "#s49 .shard", BEAT = 1.95;

    T.forEach((t, i) => {
