<!doctype html>
<html lang="en" data-resolution="portrait" data-composition-variables='[{"id": "footageSrc", "type": "string", "label": "Talking-head footage (path in assets/)", "default": "assets/speaker-warm.mp4"}, {"id": "accent", "type": "color", "label": "Keyword highlight", "default": "#ffc23d"}, {"id": "brand", "type": "color", "label": "Brand badge", "default": "#ff4d4d"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>03 Creator Tool Promo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #111; }
      #bg { position: absolute; inset: 0; background: #111; z-index: 0; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="11.6" data-width="1080" data-height="1920">
      <div id="bg"></div>
      <video id="footage" class="clip" src="assets/speaker-warm.mp4" data-var-src="footageSrc" muted playsinline
        data-start="0" data-duration="11.6" data-track-index="1"
        style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;z-index:1"></video>
      <div id="ct1" data-composition-id="ct1" data-composition-src="compositions/ct1.html"
        data-start="0" data-duration="2.2" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="ct2" data-composition-id="ct2" data-composition-src="compositions/ct2.html"
        data-start="2.2" data-duration="3" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:11"></div>
      <div id="ct3" data-composition-id="ct3" data-composition-src="compositions/ct3.html"
        data-start="5.2" data-duration="3.6" data-track-index="4" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:12"></div>
      <div id="ct4" data-composition-id="ct4" data-composition-src="compositions/ct4.html"
        data-start="8.8" data-duration="2.8" data-track-index="5" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:13"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
