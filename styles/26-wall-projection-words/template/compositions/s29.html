<template>
  <style>
    #s29 { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(160deg, var(--c3, #ff5fc8) 0%, #c2187e 55%, #4a0c3a 100%); perspective: 1500px; }
    #s29 .panel { position: absolute; left: 40px; top: 560px; width: 1000px; height: 800px; background: var(--c4, #f4efe4); overflow: hidden;
      transform: rotateY(-16deg) rotateX(5deg); box-shadow: 30px 40px 80px rgba(40,0,30,.45); border-radius: 6px; }
    #s29 .ln { position: absolute; left: 0; width: 1000px; bottom: 300px; text-align: center; white-space: nowrap; line-height: 1; transform-origin: 50% 100%; }
    #s29 .a { font: italic 900 1em Inter, sans-serif; color: var(--c1, #0e0b1f); letter-spacing: -0.04em; }
    #s29 .b { font: italic 900 .5em Inter, sans-serif; color: var(--c2, #2f55ff); letter-spacing: -0.02em; margin-left: .18em; vertical-align: .35em; }
  </style>
  <div id="s29" data-composition-id="s29" data-width="1080" data-height="1920">
    <!-- one .ln per beat: data-size = font size; .a = big black word, .b = small accent word -->
    <div class="panel" data-layout-allow-overflow data-layout-allow-overlap>
      <div class="ln" data-layout-ignore data-size="190"><span class="a">lorem</span><span class="b">ipsum</span></div>
      <div class="ln" data-layout-ignore data-size="230"><span class="a">dolor</span></div>
      <div class="ln" data-layout-ignore data-size="150"><span class="b" style="margin:0 .18em 0 0">sit</span><span class="a">amet</span></div>
      <div class="ln" data-layout-ignore data-size="120"><span class="a">consectetur</span></div>
      <div class="ln" data-layout-ignore data-size="210"><span class="a">elit</span><span class="b">sed</span></div>
      <div class="ln" data-layout-ignore data-size="170"><span class="b" style="margin:0 .18em 0 0">do</span><span class="a">tempor</span></div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // Words are projected onto a tilted wall. Each new line slams up from the bottom (rotating up from flat, squash on landing)
    // and pushes the stack up; old lines leave over the top edge of the wall.
    const lines = [...document.querySelectorAll("#s29 .ln")], STEP = 0.78, T0 = 0.25;
    lines.forEach(l => { l.style.fontSize = l.dataset.size + "px"; });
    const H = lines.map(l => +l.dataset.size * 0.98);
    gsap.set(lines, { y: 420, rotationX: -80, opacity: 0 });
    lines.forEach((l, i) => {
      const t = T0 + i * STEP;
      tl.to(l, { y: 0, rotationX: 0, opacity: 1, duration: 0.42, ease: "back.out(1.5)" }, t);
      tl.fromTo(l, { scaleY: 1 }, { scaleY: 0.86, scaleX: 1.06, duration: 0.08, ease: "power1.out", yoyo: true, repeat: 1 }, t + 0.32);
      if (i) tl.to(lines.slice(0, i), { y: "-=" + H[i], duration: 0.42, ease: "power3.out" }, t);
    });
    tl.to("#s29 .panel", { rotationY: -24, scale: 1.04, duration: 6, ease: "none" }, 0);
    tl.to(lines, { y: "-=900", duration: 0.5, ease: "power3.in", stagger: 0.03 }, T0 + lines.length * STEP + 0.6);
    window.__timelines["s29"] = tl;
  </script>
</template>
