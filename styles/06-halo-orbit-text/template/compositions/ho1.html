<template>
  <style>
    @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("assets/fonts/instrument-serif-italic.woff2") format("woff2"); }
    #ho1 { position: absolute; inset: 0; overflow: hidden; perspective: 1200px; color: var(--ink, #fff); }
    #ho1 .dt-layer { position: absolute; inset: 0; transform-style: preserve-3d; }
    #ho1 .dt-cut { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #ho1 .w { position: absolute; white-space: nowrap; text-shadow: 0 8px 30px rgba(0,0,0,.35); }
    #ho1 .sans { font-family: Inter, sans-serif; font-weight: 900; letter-spacing: -0.055em; }
    #ho1 .sans7 { font-family: Inter, sans-serif; font-weight: 700; letter-spacing: -0.03em; }
    #ho1 .serif { font-family: "Instrument Serif", serif; font-style: italic; letter-spacing: -0.01em; color: var(--accent, #ff7a59); }
    #ho1 .ring { position: absolute; left: 540px; top: 700px; width: 0; height: 0; transform-style: preserve-3d; }
    #ho1 .rw { position: absolute; left: 0; top: 0; font-size: 74px; line-height: 1; transform-origin: 0 0; }
  </style>
  <div id="ho1" data-composition-id="ho1" data-width="1080" data-height="1920">
    <div id="ho1-back" class="dt-layer">
      <div id="ho1-rb" class="ring">
        <div id="ho1-b0" class="w sans7 rw">lorem</div>
        <div id="ho1-b1" class="w sans7 rw">ipsum</div>
        <div id="ho1-b2" class="w sans7 rw">dolor</div>
        <div id="ho1-b3" class="w sans7 rw">sit</div>
        <div id="ho1-b4" class="w sans7 rw">amet</div>
        <div id="ho1-b5" class="w sans7 rw">3D</div>
        <div id="ho1-b6" class="w sans7 rw">elit</div>
        <div id="ho1-b7" class="w sans7 rw">sed</div>
        <div id="ho1-b8" class="w sans7 rw">do</div>
      </div>
    </div>
    <!-- subject cut-out sits between the back and front text layers: this is what puts words "behind" the person -->
    <img id="ho1-cut" class="dt-cut" data-layout-allow-occlusion src="assets/subject-cutout-depth.png" data-var-src="cutoutSrc" alt="">
    <div id="ho1-front" class="dt-layer">
      <div id="ho1-rf" class="ring">
        <div id="ho1-f0" class="w sans7 rw">lorem</div>
        <div id="ho1-f1" class="w sans7 rw">ipsum</div>
        <div id="ho1-f2" class="w sans7 rw">dolor</div>
        <div id="ho1-f3" class="w sans7 rw">sit</div>
        <div id="ho1-f4" class="w sans7 rw">amet</div>
        <div id="ho1-f5" class="w sans7 rw">3D</div>
        <div id="ho1-f6" class="w sans7 rw">elit</div>
        <div id="ho1-f7" class="w sans7 rw">sed</div>
        <div id="ho1-f8" class="w sans7 rw">do</div>
      </div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // words sit on a circle (baseline along the tangent), the circle is tilted back in 3D and spins.
    // Each word exists twice: back layer (under the cut-out) and front layer (over it); only the copy on the right side of the ring shows.
    const N = 9, R = 300, TILT = 62;                        // ring radius px, tilt from screen plane in degrees
    const front = [...Array(N).keys()].map(i => document.getElementById("ho1-f" + i));
    const back = [...Array(N).keys()].map(i => document.getElementById("ho1-b" + i));
    const st = { spin: -40 };
    function place() {
      for (let i = 0; i < N; i++) {
        const a = st.spin + i * 360 / N, rad = a * Math.PI / 180;
        const near = Math.sin(rad) > 0;                       // lower half of the ring is tilted toward camera
        const tf = `rotateZ(${a}deg) translateX(${R}px) rotateZ(90deg) translate(-50%, -100%)`;
        front[i].style.transform = tf; back[i].style.transform = tf;
        front[i].style.opacity = near ? 1 : 0; back[i].style.opacity = near ? 0 : 0.85;
      }
    }
    tl.fromTo(st, { spin: -40 }, { spin: 150, duration: 2.8, ease: "power1.inOut", onUpdate: place }, 0);
    tl.fromTo(["#ho1-rb", "#ho1-rf"], { rotationX: TILT, scale: 0.45, opacity: 0 }, { rotationX: TILT, scale: 1, opacity: 1, duration: 0.6, ease: "expo.out" }, 0);
    tl.to(["#ho1-rb", "#ho1-rf"], { scale: 1.15, duration: 1.6, ease: "sine.inOut" }, 0.6);
    tl.to(["#ho1-rb", "#ho1-rf"], { scale: 2.2, opacity: 0, duration: 0.35, ease: "power3.in" }, 2.42);
    place();
    window.__timelines["ho1"] = tl;
  </script>
</template>
