<template>
  <style>
    @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("assets/fonts/instrument-serif-italic.woff2") format("woff2"); }
    #lk1 { position: absolute; inset: 0; overflow: hidden;
      background: radial-gradient(ellipse 90% 60% at 50% 50%, var(--stageLight, #2a2160) 0%, var(--stageDeep, #0e0b1f) 100%); }
    #lk1 .cam { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
    #lk1 .w { position: absolute; left: 0; top: 0; white-space: pre; line-height: 1; transform-origin: 50% 50%; opacity: 0; }
    #lk1 .sans { font-family: Inter, sans-serif; font-weight: 900; letter-spacing: -0.01em; color: var(--c1, #f4efe4); }
    #lk1 .serif { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; color: var(--c3, #ff5fc8); }
    #lk1 .acc { color: var(--c2, #c8ff3c); }
    #lk1-copy { display: none; }
  </style>
  <div id="lk1" data-composition-id="lk1" data-width="1080" data-height="1920">
    <!-- One <p> per row of the lockup, top to bottom. Every row is justified to the same width, so short rows come out
         big and long rows small. data-font = sans | serif. Wrap accent words in <b>. Words arrive in reading order. -->
    <div id="lk1-copy">
      <p data-font="sans">LOREM IPSUM</p>
      <p data-font="serif">dolor sit amet</p>
      <p data-font="sans">CONSECTETUR</p>
      <p data-font="sans">ADIPISCING <b>ELIT</b></p>
      <p data-font="serif">sed do</p>
      <p data-font="sans"><b>EIUSMOD</b></p>
      <p data-font="sans">TEMPOR INCIDIDUNT</p>
    </div>
    <div class="cam" data-layout-allow-overlap data-layout-allow-overflow></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // LAYOUT: rows are justified to width BW in block space (origin = block top-left). Font size per row = whatever
    // makes the row exactly BW wide. The block is then centred on screen; if it is too tall, BW shrinks.
    const BW0 = 880, MAXH = 1480, ROWGAP = 0.07, WORDGAP = 0.24;   // ROWGAP x BW between rows, WORDGAP x font size between words
    // TIMING
    const FIRST = 0.3, STEP = 0.25, FLY = 0.55, EXIT = 5.0, EXIT_STEP = 0.08;
    const cam = document.querySelector("#lk1 .cam");
    let WORDS = [], KEYS = [], ROWS = 0, BW = BW0, BH = 0;
    const st = { t: 0 };
    const clamp = x => Math.max(0, Math.min(1, x)), lerp = (a, b, k) => a + (b - a) * k;
    const easeOut = x => 1 - Math.pow(1 - x, 3), inOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    const backOut = x => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
    // Cap height / box metrics (em) so rows can be packed by their visible letters, not their line boxes
    const M = { sans: { top: 0.137, h: 0.727 }, serif: { top: 0.13, h: 0.86 } };
    function layout(bw) {
      cam.replaceChildren(); WORDS = [];
      const probe = document.createElement("span"); cam.appendChild(probe);
      const rows = [...document.querySelectorAll("#lk1-copy p")];
      let y = 0;
      rows.forEach((p, ri) => {
        const font = p.dataset.font === "serif" ? "serif" : "sans";
        const words = [];
        p.childNodes.forEach(n => n.textContent.trim().split(/\s+/).filter(Boolean).forEach(t => words.push([t, n.nodeName === "B"])));
        probe.className = "w " + font; probe.style.fontSize = "100px";
        const w100 = words.map(([t]) => { probe.textContent = t; return probe.offsetWidth; });
        const nat = w100.reduce((a, b) => a + b, 0) + WORDGAP * 100 * (words.length - 1);
        const fs = 100 * bw / nat, k = fs / 100;
        let x = 0;
        words.forEach(([t, acc], i) => {
          const e = document.createElement("span"); e.className = "w " + font + (acc ? " acc" : "");
          e.textContent = t; e.style.fontSize = fs.toFixed(2) + "px"; cam.appendChild(e);
          const w = w100[i] * k;
          WORDS.push({ el: e, row: ri, x, y: y - M[font].top * fs, w, h: fs, cx: x + w / 2, cy: y + M[font].h * fs / 2, n: WORDS.length });
          x += w + WORDGAP * fs;
        });
        y += M[font].h * fs + ROWGAP * bw;
      });
      probe.remove();
      ROWS = rows.length; return y - ROWGAP * bw;
    }
    function build() {
      BW = BW0; BH = layout(BW);
      if (BH > MAXH) { BW = BW0 * MAXH / BH; BH = layout(BW); }
      // CAMERA KEYS: as each word lands the camera frames it (closer for small words), then eases back a little more
      // each time, until the last key shows the whole block.
      const N = WORDS.length; KEYS = [];
      const full = { x: BW / 2, y: BH / 2, z: 1 };
      WORDS.forEach((w, i) => {
        const land = FIRST + i * STEP + FLY;
        const zWord = Math.min(2.4, Math.max(1.15, 620 / Math.max(w.w, w.h * 1.4)));
        const k = Math.pow(i / Math.max(1, N - 1), 1.4);          // later words: framed wider, nearer the whole block
        KEYS.push({ t: land - FLY * 0.6, x: lerp(w.cx, full.x, k * 0.85), y: lerp(w.cy, full.y, k * 0.85), z: lerp(zWord, 1.12, k) });
      });
      KEYS.push({ t: FIRST + N * STEP + FLY + 0.35, ...full });
      KEYS.unshift({ t: 0, x: WORDS[0].cx, y: WORDS[0].cy, z: KEYS[0].z * 1.15 });
      place();
    }
    function camAt(t) {
      if (t <= KEYS[0].t) return KEYS[0];
      for (let i = 0; i < KEYS.length - 1; i++) {
        const a = KEYS[i], b = KEYS[i + 1];
        if (t <= b.t) { const k = inOut((t - a.t) / (b.t - a.t)); return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), z: lerp(a.z, b.z, k) }; }
      }
      return KEYS[KEYS.length - 1];
    }
    function place() {
      if (!KEYS.length) return;
      const t = st.t;
      let c = { ...camAt(t) };
      // never show a ragged half-row: when the zoomed block is wider than the frame, keep the frame inside it;
      // when it fits, centre it horizontally
      const half = 540 / c.z;
      c.x = BW * c.z > 1000 ? Math.max(half - 40 / c.z, Math.min(BW - half + 40 / c.z, c.x)) : BW / 2;
      // EXIT: a slow push-in on the whole block while the rows flip away top to bottom
      const px = easeOut(clamp((t - EXIT) / 1.1));
      const z = c.z * (1 + 0.18 * px);
      cam.style.transform = `translate(540px, 960px) scale(${z.toFixed(4)}) translate(${(-c.x).toFixed(2)}px, ${(-c.y).toFixed(2)}px)`;
      WORDS.forEach(w => {
        const t0 = FIRST + w.n * STEP;
        const p = clamp((t - t0) / FLY), e = easeOut(p), b = backOut(p), q = 1 - e;
        // four entrances, cycling: flip down from above, swing in from the right, 90° spin from the left, rise toward camera
        let tf = "";
        switch (w.n % 4) {
          case 0: tf = `translate(0px, ${(-260 * q).toFixed(1)}px) rotateX(${(-90 * (1 - b)).toFixed(2)}deg)`; break;
          case 1: tf = `translate(${(340 * q).toFixed(1)}px, 0px) rotateY(${(95 * (1 - b)).toFixed(2)}deg)`; break;
          case 2: tf = `translate(${(-300 * q).toFixed(1)}px, ${(80 * q).toFixed(1)}px) rotate(${(-90 * (1 - b)).toFixed(2)}deg) scale(${(1 + 0.5 * q).toFixed(3)})`; break;
          default: tf = `translate(0px, ${(240 * q).toFixed(1)}px) translateZ(${(380 * q).toFixed(1)}px) rotateX(${(80 * (1 - b)).toFixed(2)}deg)`;
        }
        // EXIT: each row flips up and away, top row first
        const pr = clamp((t - EXIT - w.row * EXIT_STEP) / 0.5), xe = pr * pr;
        if (pr > 0) tf += ` translate(0px, ${(-120 * xe).toFixed(1)}px) rotateX(${(85 * xe).toFixed(2)}deg)`;
        w.el.style.transform = `translate(${w.x.toFixed(2)}px, ${w.y.toFixed(2)}px) perspective(900px) ${tf}`;
        w.el.style.opacity = (clamp(p * 2.2) * (1 - pr)).toFixed(3);
        const blur = 12 * q * q + 10 * xe;        // motion blur while flying
        w.el.style.filter = blur > 0.2 ? `blur(${blur.toFixed(1)}px)` : "none";
      });
    }
    window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
    window.__hf.buildReady["lk1"] = Promise.all([
      document.fonts.load("900 100px Inter"), document.fonts.load('italic 400 100px "Instrument Serif"')
    ]).then(build);
    tl.fromTo(st, { t: 0 }, { t: 6, duration: 6, ease: "none", onUpdate: place }, 0);
    window.__timelines["lk1"] = tl;
  </script>
</template>
