<template>
  <style>
    @font-face { font-family: "Inter Tight"; font-weight: 700; src: url("assets/fonts/inter-tight-bold.woff2") format("woff2"); }
    @font-face { font-family: "Inter Tight"; font-weight: 800; src: url("assets/fonts/inter-tight-extrabold.woff2") format("woff2"); }
    #wp2 { position: absolute; inset: 0; overflow: hidden; }
    /* the caption line is a mask: words roll up into it from below and out of it at the top */
    #wp2 .line { position: absolute; left: 0; width: 1080px; height: 170px; overflow: hidden; }
    #wp2 .cw { position: absolute; left: 0; top: 10px; width: 1080px; text-align: center; font: 700 132px "Inter Tight", sans-serif; letter-spacing: -0.045em;
      line-height: 1.1; color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,.35); }
    #wp2-ln { top: 1050px; }
    #wp2-box { position: absolute; left: 430px; top: 1040px; width: 220px; height: 180px; overflow: visible; }
    #wp2-cur { position: absolute; left: 0; top: 0; width: 70px; height: 84px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.4)); }
  </style>
  <div id="wp2" data-composition-id="wp2" data-width="1080" data-height="1920">
    <!-- Cursor-select: resize #wp2-box to wrap the chosen word; the cursor path is in the timeline. -->
    <div id="wp2-ln" class="line" data-layout-allow-overflow>
      <div id="wp2-w1" class="cw">lorem</div>
      <div id="wp2-sel" class="cw">ip</div>
      <div id="wp2-w3" class="cw">dolor</div>
      <div id="wp2-w4" class="cw">sitam</div>
    </div>
    <svg id="wp2-box" viewBox="0 0 220 180">
      <rect id="wp2-rect" x="4" y="4" width="212" height="172" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="14 10"/>
      <g id="wp2-handles" fill="#fff" stroke="#111" stroke-width="2"><rect x="-6" y="-6" width="18" height="18"/><rect x="208" y="-6" width="18" height="18"/><rect x="-6" y="168" width="18" height="18"/><rect x="208" y="168" width="18" height="18"/></g>
    </svg>
    <svg id="wp2-cur" viewBox="0 0 70 84"><path d="M4 4 L4 66 L20 52 L32 80 L44 74 L32 48 L54 48 Z" fill="#fff" stroke="#111" stroke-width="4" stroke-linejoin="round"/></svg>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    gsap.set("#wp2 .cw", { yPercent: 120 });   // every caption word starts parked below its mask
    // ROLL: the word slides up into the caption mask (0.16 s), and slides out the top when the next one comes
    function roll(sel, t, end) {
      tl.fromTo(sel, { yPercent: 120 }, { yPercent: 0, duration: 0.16, ease: "power3.out" }, t);
      if (end !== undefined) tl.to(sel, { yPercent: -120, duration: 0.14, ease: "power3.in" }, end - 0.06);
    }
    // DRAW: an SVG stroke draws itself on (marker underline, scribble, box)
    function draw(sel, t, dur) {
      const p = document.querySelector(sel), L = Math.ceil(p.getTotalLength()) + 2;   // path length is pure geometry
      p.style.strokeDasharray = L;
      tl.fromTo(sel, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t);
    }
    roll("#wp2-w1", 0.0, 0.42); roll("#wp2-sel", 0.42, 1.3);
    // cursor glides in from bottom-right and clicks the word
    tl.fromTo("#wp2-cur", { x: 1000, y: 1500, opacity: 1 }, { x: 600, y: 1150, duration: 0.4, ease: "power3.out" }, 0.45);
    tl.to("#wp2-cur", { keyframes: [{ scale: 0.82, duration: 0.06 }, { scale: 1, duration: 0.1 }] }, 0.86);
    // on click: the frame grows out from the click point, handles pop, the word turns lime
    tl.fromTo("#wp2-box", { scale: 0, transformOrigin: "80% 60%", opacity: 1 }, { scale: 1, duration: 0.2, ease: "back.out(2)" }, 0.88);
    tl.fromTo("#wp2-handles rect", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.12, stagger: 0.03, ease: "back.out(3)" }, 1.0);
    tl.fromTo("#wp2-sel", { color: "#ffffff" }, { color: "var(--highlight, #c8ff3c)", duration: 0.01 }, 0.9);
    tl.to("#wp2-cur", { x: 1100, y: 1700, duration: 0.3, ease: "power2.in" }, 1.1);
    tl.set("#wp2-box", { opacity: 0 }, 1.26);
    roll("#wp2-w3", 1.3, 1.75); roll("#wp2-w4", 1.75, 2.2);
    window.__timelines["wp2"] = tl;
  </script>
</template>
