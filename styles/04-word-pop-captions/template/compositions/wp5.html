<template>
  <style>
    @font-face { font-family: "Inter Tight"; font-weight: 700; src: url("assets/fonts/inter-tight-bold.woff2") format("woff2"); }
    @font-face { font-family: "Inter Tight"; font-weight: 800; src: url("assets/fonts/inter-tight-extrabold.woff2") format("woff2"); }
    #wp5 { position: absolute; inset: 0; overflow: hidden; }
    /* the caption line is a mask: words roll up into it from below and out of it at the top */
    #wp5 .line { position: absolute; left: 0; width: 1080px; height: 170px; overflow: hidden; }
    #wp5 .cw { position: absolute; left: 0; top: 10px; width: 1080px; text-align: center; font: 700 132px "Inter Tight", sans-serif; letter-spacing: -0.045em;
      line-height: 1.1; color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,.35); }
    #wp5-ln { top: 1060px; }
    #wp5-w1 { color: var(--highlight, #c8ff3c); }
    #wp5-pair { position: absolute; left: 0; width: 1080px; top: 1010px; text-align: center; }
    #wp5-pair .s { display: inline-block; font: 700 46px "Inter Tight", sans-serif; color: var(--highlight, #c8ff3c); margin-left: 150px; text-shadow: 0 3px 14px rgba(0,0,0,.35); }
    #wp5-num { display: block; font: 800 150px/0.9 "Inter Tight", sans-serif; letter-spacing: -0.04em; color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,.35); }
    #wp5-hl { position: absolute; left: 0; width: 1080px; top: 1060px; text-align: center; }
    #wp5-hl span { position: relative; isolation: isolate; display: inline-block; font: 800 120px/1 "Inter Tight", sans-serif; letter-spacing: -0.04em; color: #111; padding: 0 16px; }
    #wp5-hl svg { position: absolute; left: -10px; top: 0; width: calc(100% + 20px); height: 100%; overflow: visible; }
    #wp5-hw { position: relative; }   /* the word paints after (above) the marker svg */
  </style>
  <div id="wp5" data-composition-id="wp5" data-width="1080" data-height="1920">
    <!-- Lime keywords: counting value under a label, marker stroke behind black text. -->
    <div id="wp5-ln" class="line" data-layout-allow-overflow><div id="wp5-w1" class="cw">lorem</div></div>
    <div id="wp5-pair"><span class="s" id="wp5-lab">ipsum</span><span id="wp5-num">0.0</span></div>
    <div id="wp5-hl"><span><svg viewBox="0 0 100 40" preserveAspectRatio="none"><path id="wp5-mk" d="M2 22 C 30 18, 60 26, 98 20" fill="none" stroke="var(--highlight, #c8ff3c)" stroke-width="30" stroke-linecap="round"/></svg><span id="wp5-hw" style="padding:0">dolorem</span></span></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    gsap.set("#wp5 .cw", { yPercent: 120 });   // every caption word starts parked below its mask
    // ROLL: the word slides up into the caption mask (0.16 s), and slides out the top when the next one comes
    function roll(sel, t, end) {
      tl.fromTo(sel, { yPercent: 120 }, { yPercent: 0, duration: 0.16, ease: "power3.out" }, t);
      if (end !== undefined) tl.to(sel, { yPercent: -120, duration: 0.14, ease: "power3.in" }, end - 0.06);
    }
    // DRAW: an SVG stroke draws itself on (marker underline, scribble, box)
    function draw(sel, t, dur) {
      const p = document.querySelector(sel), L = Math.ceil(p.getTotalLength()) + 2;   // path length is pure geometry
      p.style.strokeDasharray = L;
      tl.fromTo(sel, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, t);
    }
    roll("#wp5-w1", 0.0, 0.5);
    tl.set("#wp5-pair", { opacity: 0 }, 0); tl.set("#wp5-pair", { opacity: 1 }, 0.58); tl.set("#wp5-pair", { opacity: 0 }, 1.3);
    // the value counts up from 0.0 while the label slides in from the left
    const num = document.getElementById("wp5-num"), n = { v: 0 };
    tl.fromTo(n, { v: 0 }, { v: 3.0, duration: 0.5, ease: "power2.out", onUpdate: () => { num.textContent = n.v.toFixed(1); } }, 0.58);
    tl.fromTo("#wp5-lab", { x: -260, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, 0.6);
    // a fat marker stroke draws left to right behind the black word
    tl.set("#wp5-hl", { opacity: 0 }, 0); tl.set("#wp5-hl", { opacity: 1 }, 1.3); tl.set("#wp5-hl", { opacity: 0 }, 2.35);
    draw("#wp5-mk", 1.3, 0.3);
    window.__timelines["wp5"] = tl;
  </script>
</template>
