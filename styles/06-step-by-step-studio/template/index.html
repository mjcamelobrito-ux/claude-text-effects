<!doctype html>
<html lang="en" data-resolution="portrait" data-composition-variables='[{"id": "footageSrc", "type": "string", "label": "Talking-head footage (path in assets/)", "default": "assets/speaker-blue.mp4"}, {"id": "stepA", "type": "color", "label": "Step title gradient start", "default": "#7fd3ff"}, {"id": "stepB", "type": "color", "label": "Step title gradient end", "default": "#3b6bff"}, {"id": "uiAccent", "type": "color", "label": "UI accent (header, buttons)", "default": "#3b5bff"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>06 Step-by-Step Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #06102a; }
      #bg { position: absolute; inset: 0; background: #06102a; z-index: 0; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="12.2" data-width="1080" data-height="1920">
      <div id="bg"></div>
      <video id="footage" class="clip" src="assets/speaker-blue.mp4" data-var-src="footageSrc" muted playsinline
        data-start="0" data-duration="12.2" data-track-index="1"
        style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;z-index:1"></video>
      <div id="st1" data-composition-id="st1" data-composition-src="compositions/st1.html"
        data-start="0" data-duration="2.4" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="st2" data-composition-id="st2" data-composition-src="compositions/st2.html"
        data-start="2.4" data-duration="1.8" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:11"></div>
      <div id="st3" data-composition-id="st3" data-composition-src="compositions/st3.html"
        data-start="4.2" data-duration="3.2" data-track-index="4" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:12"></div>
      <div id="st4" data-composition-id="st4" data-composition-src="compositions/st4.html"
        data-start="7.4" data-duration="2.6" data-track-index="5" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:13"></div>
      <div id="st5" data-composition-id="st5" data-composition-src="compositions/st5.html"
        data-start="10" data-duration="2.2" data-track-index="6" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:14"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
