  <script>
    const tl = gsap.timeline({ paused: true });
    // each tile cycles through seeded random characters (one flip every 0.07 s) before landing on its target;
    // tiles start in a left-to-right wave. A flip = top flap falls (0 → -90°) then bottom flap lands (90° → 0).
    const POOL = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    function rng(s) { return () => { s = (s * 16807) % 2147483647; return s / 2147483647; }; }
    const tiles = [...document.querySelectorAll("#sf1 .tile")].map((el, k) => {
      const r = rng(97 + k * 31), target = el.dataset.target, n = 6 + Math.floor(r() * 6), seq = [" "];
      for (let i = 0; i < n; i++) seq.push(POOL[Math.floor(r() * POOL.length)]);
      seq.push(target);
      const row = +el.id.split("-")[1].slice(1), col = +el.id.split("-")[2];
      return { el, seq, start: 0.15 + col * 0.07 + row * 0.25, sp: [...el.querySelectorAll("span")], fa: el.querySelector(".fa"), fb: el.querySelector(".fb") };
    });
    const FLIP = 0.07, st = { t: 0 };
    function render() {
      const t = st.t;
      for (const T of tiles) {
        const steps = T.seq.length - 1, f = Math.max(0, Math.min(steps, (t - T.start) / FLIP)), i = Math.floor(f), p = f - i;
        const cur = T.seq[Math.min(i, steps)], nxt = T.seq[Math.min(i + 1, steps)], done = i >= steps;
        // spans: [top, bot, flapA, flapB]
        T.sp[0].textContent = done ? cur : nxt;        // static top already shows the next character
        T.sp[1].textContent = done ? cur : (p < .5 ? cur : nxt);
        T.sp[2].textContent = cur; T.sp[3].textContent = nxt;
        const a = done ? 0 : p < .5 ? -180 * p : -90, b = done ? 0 : p < .5 ? 90 : 90 - 180 * (p - .5);
        T.fa.style.transform = `rotateX(${a}deg)`; T.fa.style.opacity = done || p >= .5 ? 0 : 1;
        T.fb.style.transform = `rotateX(${b}deg)`; T.fb.style.opacity = done || p < .5 ? 0 : 1;
        T.el.classList.toggle("lit", done && t < T.start + steps * FLIP + 0.12);   // brief highlight as it lands
      }
    }
    tl.fromTo("#sf1-board", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 0);
    tl.fromTo(st, { t: 0 }, { t: 3.6, duration: 3.6, ease: "none", onUpdate: render }, 0);
    tl.to("#sf1-board", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, 3.3);
    render();
    window.__timelines["sf1"] = tl;
  </script>
