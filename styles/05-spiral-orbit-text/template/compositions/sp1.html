<template>
  <style>
    @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("assets/fonts/instrument-serif-italic.woff2") format("woff2"); }
    #sp1 { position: absolute; inset: 0; overflow: hidden; perspective: 1100px; color: var(--ink, #fff); }
    #sp1 .layer { position: absolute; inset: 0; transform-style: preserve-3d; }
    /* the spiral plane: centred on the head, tilted back so the lower turns come toward camera */
    #sp1 .plane { position: absolute; left: 540px; top: 720px; width: 0; height: 0; transform-style: preserve-3d; }
    #sp1 .sw { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; transform-origin: 0 0; opacity: 0;
      text-shadow: 0 6px 22px rgba(0,0,0,.4); }
    #sp1 .sans { font: 700 92px Inter, sans-serif; letter-spacing: -0.03em; }
    #sp1 .serif { font-family: "Instrument Serif", serif; font-style: italic; font-size: 116px; color: var(--accent, #c8ff3c); }
    #sp1-cut { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="sp1" data-composition-id="sp1" data-width="1080" data-height="1920">
    <!-- Edit the words in BOTH lists (back + front copies must match). Order = reading order along the spiral. -->
    <div id="sp1-back" class="layer">
      <div id="sp1-pb" class="plane">
          <div id="sp1-b0" class="sw sans">lorem</div>
          <div id="sp1-b1" class="sw sans">ipsum</div>
          <div id="sp1-b2" class="sw sans">dolor</div>
          <div id="sp1-b3" class="sw sans">sit</div>
          <div id="sp1-b4" class="sw sans">amet</div>
          <div id="sp1-b5" class="sw serif">3D</div>
          <div id="sp1-b6" class="sw sans">consectetur</div>
          <div id="sp1-b7" class="sw sans">elit</div>
      </div>
    </div>
    <!-- subject cut-out between the layers: the far side of the spiral passes behind the person -->
    <img id="sp1-cut" data-layout-allow-occlusion src="assets/subject-cutout-depth.png" data-var-src="cutoutSrc" alt="">
    <div id="sp1-front" class="layer">
      <div id="sp1-pf" class="plane">
          <div id="sp1-f0" class="sw sans">lorem</div>
          <div id="sp1-f1" class="sw sans">ipsum</div>
          <div id="sp1-f2" class="sw sans">dolor</div>
          <div id="sp1-f3" class="sw sans">sit</div>
          <div id="sp1-f4" class="sw sans">amet</div>
          <div id="sp1-f5" class="sw serif">3D</div>
          <div id="sp1-f6" class="sw sans">consectetur</div>
          <div id="sp1-f7" class="sw sans">elit</div>
      </div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // ---- spiral geometry ----------------------------------------------------------------------------
    // Archimedean spiral r(θ) = R0 - K·θ (θ in degrees, clockwise from 12 o'clock), tilted back in 3D.
    // Words are laid end to end along it: each word's angular length = its width / radius.
    const N = 8, R0 = 400, K = 0.42, GAP = 30, START = -25, TILT = 32, ROLL = -8;
    const F = [...Array(N).keys()].map(i => document.getElementById("sp1-f" + i));
    const B = [...Array(N).keys()].map(i => document.getElementById("sp1-b" + i));
    const T_IN = [0.15, 0.5, 0.85, 1.15, 1.45, 1.8, 2.15, 2.6];   // when each word starts arriving (sync to speech)
    let SLOT = null;                                             // target angle of each word's centre, set once fonts load
    const st = { t: 0 };
    const ease = k => 1 - Math.pow(1 - k, 3);
    function place() {
      if (!SLOT) return;
      const t = st.t, spin = 26 * t;                             // the whole spiral keeps turning clockwise
      for (let i = 0; i < N; i++) {
        // ARRIVAL: the word slides in along the track from 140° behind its slot, fading up
        const k = Math.max(0, Math.min(1, (t - T_IN[i]) / 0.55)), e = ease(k);
        const th = SLOT[i] - 140 * (1 - e) + spin, r = Math.max(120, R0 - K * (th - spin - START));
        const a = th * Math.PI / 180, near = Math.cos(a) < 0;    // lower half of the tilted plane faces the camera
        const tf = `rotateZ(${th - 90}deg) translateX(${r}px) rotateZ(90deg) translate(-50%, -100%)`;
        F[i].style.transform = tf; B[i].style.transform = tf;
        F[i].style.opacity = near ? e : 0; B[i].style.opacity = near ? 0 : 0.8 * e;
      }
    }
    window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
    window.__hf.buildReady["sp1"] = Promise.all([document.fonts.load("700 92px Inter"), document.fonts.load('italic 116px "Instrument Serif"')]).then(() => {
      SLOT = []; let th = START;
      F.forEach((el, i) => {
        const r = R0 - K * (th - START), span = (el.offsetWidth + GAP) / r * 180 / Math.PI;
        SLOT.push(th + span / 2); th += span;                    // walk along the spiral, word by word
      });
      place();
    });
    tl.set(["#sp1-pb", "#sp1-pf"], { rotationX: TILT, rotationZ: ROLL }, 0);
    tl.fromTo(st, { t: 0 }, { t: 6.2, duration: 6.2, ease: "none", onUpdate: place }, 0);
    // a slow breathing push while it builds
    tl.fromTo(["#sp1-pb", "#sp1-pf"], { scale: 0.92 }, { scale: 1.04, duration: 4.6, ease: "sine.inOut" }, 0);
    // DIVE: the camera plunges through the centre of the spiral; the turns rush outward past the lens
    tl.to(["#sp1-pb", "#sp1-pf"], { scale: 4.2, rotationZ: ROLL - 40, duration: 1.0, ease: "power3.in" }, 4.9);
    tl.to(["#sp1-back", "#sp1-front"], { opacity: 0, filter: "blur(14px)", duration: 0.35, ease: "power2.in" }, 5.6);
    window.__timelines["sp1"] = tl;
  </script>
</template>
