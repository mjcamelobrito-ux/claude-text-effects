<template>
  <style>
    @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("assets/fonts/instrument-serif-italic.woff2") format("woff2"); }
    /* the camera: perspective + vanishing point must match the room in the footage (see STYLE.md: lining up a wall) */
    #wl1 { position: absolute; inset: 0; overflow: hidden; perspective: 1000px; perspective-origin: 540px 860px; }
    /* each wall is a plane 3000 px deep, standing on the screen edge and running away from camera to the back wall */
    #wl1 .wall { position: absolute; top: 200px; width: 3000px; height: 1420px; transform-style: preserve-3d; }
    #wl1-L { left: 60px; transform-origin: 0 0; transform: rotateY(90deg);                    /* faces right, into the room */
      -webkit-mask-image: linear-gradient(90deg, #000 45%, transparent 95%); mask-image: linear-gradient(90deg, #000 45%, transparent 95%); }
    #wl1-R { left: -1980px; transform-origin: 100% 0; transform: rotateY(-90deg);             /* faces left, into the room */
      -webkit-mask-image: linear-gradient(270deg, #000 45%, transparent 95%); mask-image: linear-gradient(270deg, #000 45%, transparent 95%); }
    #wl1 .lane { position: absolute; left: 0; top: 0; width: 3000px; height: 1420px; }
    #wl1 .w { position: absolute; white-space: nowrap; line-height: 1; }
    #wl1 .big { font: 900 540px Inter, sans-serif; letter-spacing: -0.05em; }
    #wl1 .small { font: italic 400 260px "Instrument Serif", serif; color: var(--c3, #ff5fc8); }
    #wl1 .side-L .w { left: 700px; }
    #wl1 .side-R .w { right: 700px; text-align: right; }
    #wl1-l1 { top: 90px; color: var(--c1, #c8ff3c); }  #wl1-r1 { top: 90px; color: var(--c2, #ffffff); }
    #wl1-l2, #wl1-r2 { top: 690px; }
    #wl1-l3, #wl1-r3 { top: 990px; }
  </style>
  <div id="wl1" data-composition-id="wl1" data-width="1080" data-height="1920">
    <!-- LEFT WALL: lines read from the camera into the distance -->
    <div id="wl1-L" class="wall side-L" data-layout-allow-overflow>
      <div id="wl1-lane-L" class="lane" data-layout-allow-overflow>
        <div id="wl1-l1" class="w big">LOREM</div>
        <div id="wl1-l2" class="w small">ipsum dolor</div>
        <div id="wl1-l3" class="w small">sit amet</div>
      </div>
    </div>
    <!-- RIGHT WALL: lines read from the distance toward the camera -->
    <div id="wl1-R" class="wall side-R" data-layout-allow-overflow>
      <div id="wl1-lane-R" class="lane" data-layout-allow-overflow>
        <div id="wl1-r1" class="w big">DOLOR</div>
        <div id="wl1-r2" class="w small">consectetur</div>
        <div id="wl1-r3" class="w small">elit sed do</div>
      </div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // x on a wall = depth. Left wall: +x goes AWAY from camera. Right wall: −x goes away.
    // ARRIVE: big words glide up the corridor from the back wall to their place, left first, then right
    tl.fromTo("#wl1-l1", { x: 1900, opacity: 0 }, { x: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, 0.0);
    tl.fromTo("#wl1-r1", { x: -1900, opacity: 0 }, { x: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, 0.25);
    // PAINT ON: the serif lines are written along the wall in their reading direction (stepped clip = hand-lettered pace)
    tl.fromTo("#wl1-l2", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "steps(11)" }, 0.9);
    tl.fromTo("#wl1-l3", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "steps(8)" }, 1.3);
    tl.fromTo("#wl1-r2", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "steps(11)" }, 1.5);
    tl.fromTo("#wl1-r3", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "steps(11)" }, 1.9);
    // DOLLY: both walls' text drifts toward camera, as if we were walking down the corridor
    tl.fromTo("#wl1-lane-L", { x: 0 }, { x: -660, duration: 3.6, ease: "power1.inOut" }, 0.2);   // nearest letter ends ~40 px from the wall's near edge
    tl.fromTo("#wl1-lane-R", { x: 0 }, { x: 660, duration: 3.6, ease: "power1.inOut" }, 0.2);
    // RECEDE: everything slides away down the corridor and dissolves into the depth falloff (never crosses the frame edge)
    tl.to("#wl1-lane-L", { x: 2600, opacity: 0, duration: 0.75, ease: "power3.in" }, 4.0);
    tl.to("#wl1-lane-R", { x: -2600, opacity: 0, duration: 0.75, ease: "power3.in" }, 4.05);
    window.__timelines["wl1"] = tl;
  </script>
</template>
