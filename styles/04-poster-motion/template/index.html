<!doctype html>
<html lang="en" data-resolution="portrait" data-composition-variables='[{"id": "accent", "type": "color", "label": "Accent (pink #e5195e / orange #ef8f2b)", "default": "#e5195e"}, {"id": "accentDeep", "type": "color", "label": "Accent dark", "default": "#a8103f"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>04 Poster Motion</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #ececec; }
      #bg { position: absolute; inset: 0; background: #ececec; z-index: 0; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="11.6" data-width="1080" data-height="1920">
      <div id="bg"></div>
      <div id="pm1" data-composition-id="pm1" data-composition-src="compositions/pm1.html"
        data-start="0" data-duration="2.6" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="pm2" data-composition-id="pm2" data-composition-src="compositions/pm2.html"
        data-start="2.6" data-duration="2.4" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:11"></div>
      <div id="pm3" data-composition-id="pm3" data-composition-src="compositions/pm3.html"
        data-start="5" data-duration="1.2" data-track-index="4" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:12"></div>
      <div id="pm4" data-composition-id="pm4" data-composition-src="compositions/pm4.html"
        data-start="6.2" data-duration="2.6" data-track-index="5" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:13"></div>
      <div id="pm5" data-composition-id="pm5" data-composition-src="compositions/pm5.html"
        data-start="8.8" data-duration="2.8" data-track-index="6" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:14"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
