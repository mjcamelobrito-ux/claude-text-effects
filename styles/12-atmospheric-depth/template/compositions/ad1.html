  <script>
    const tl = gsap.timeline({ paused: true });
    // rack focus: main words resolve from blur while the foreground drifts across
    tl.fromTo("#ad1-a", { opacity: 0, filter: "blur(16px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 0.05);
    tl.fromTo("#ad1-b", { opacity: 0, filter: "blur(20px)", scale: 1.1 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.6, ease: "power2.out" }, 0.2);

    tl.fromTo("#ad1-shadow", { x: 0 }, { x: 120, duration: 2.4, ease: "none" }, 0);
    // waveform: deterministic pseudo-random heights per step (audio-reactive look)
    const bars = document.querySelectorAll("#ad1-wave i");
    for (let k = 0; k < 10; k++) {
      bars.forEach((b, i) => {
        const h = 0.25 + Math.abs(Math.sin(i * 1.7 + k * 2.3)) * 0.9;
