<!doctype html>
<html lang="en" data-resolution="portrait" data-composition-variables='[{"id": "footageSrc", "type": "string", "label": "Talking-head footage (path in assets/)", "default": "assets/speaker-warm.mp4"}, {"id": "c1", "type": "color", "label": "Word colour 1 (yellow)", "default": "#ffd23f"}, {"id": "c2", "type": "color", "label": "Word colour 2 (cyan)", "default": "#3ff2d6"}, {"id": "c3", "type": "color", "label": "Word colour 3 (red)", "default": "#ff3b3b"}, {"id": "c4", "type": "color", "label": "Word colour 4 (violet)", "default": "#c86bff"}]'>

</html>
