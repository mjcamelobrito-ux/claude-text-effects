<!doctype html>
<html lang="en" data-resolution="portrait" data-composition-variables='[{"id": "footageSrc", "type": "string", "label": "Talking-head footage (path in assets/)", "default": "assets/speaker-warm.mp4"}, {"id": "money", "type": "color", "label": "Emphasis colour 1 (numbers)", "default": "#43e02b"}, {"id": "emotion", "type": "color", "label": "Emphasis colour 2 (feelings)", "default": "#f6e51b"}, {"id": "warning", "type": "color", "label": "Emphasis colour 3 (punchline)", "default": "#e3121b"}, {"id": "marker", "type": "color", "label": "Highlighter", "default": "#f4c74a"}]'>

</html>
