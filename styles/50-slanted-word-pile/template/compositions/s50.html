<template>
  <style>
    @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("assets/fonts/instrument-serif-italic.woff2") format("woff2"); }
    #s50 { position: absolute; inset: 0; overflow: hidden; background: var(--c4, #e6e6e3); }
    #s50 .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
    #s50 .pile { position: absolute; left: 540px; top: 1100px; width: 0; height: 0; transform: rotate(-14deg); }
    #s50 .w { position: absolute; white-space: nowrap; line-height: 1; transform-origin: 0 100%; }
    #s50 .f1 { font-family: Inter, sans-serif; font-weight: 900; color: #0e0b1f; letter-spacing: -0.03em; }
    #s50 .f2 { font-family: "Archivo Black", sans-serif; color: var(--c2, #2f55ff); }
    #s50 .f3 { font-family: "Instrument Serif", serif; font-style: italic; color: var(--c3, #e0219b); }
  </style>
  <div id="s50" data-composition-id="s50" data-width="1080" data-height="1920">
    <!-- words in order; data-f = 1 (heavy navy) / 2 (wide blue) / 3 (serif pink), data-s = size -->
    <div id="s50-copy" style="display:none">
      <i data-f="1" data-s="70">lorem</i><i data-f="2" data-s="110">ipsum</i><i data-f="3" data-s="90">dolor</i><i data-f="1" data-s="150">sit</i>
      <i data-f="2" data-s="80">amet</i><i data-f="3" data-s="130">consectetur</i><i data-f="1" data-s="100">adipiscing</i><i data-f="2" data-s="170">elit</i>
      <i data-f="3" data-s="80">sed</i><i data-f="1" data-s="120">do</i><i data-f="2" data-s="100">eiusmod</i><i data-f="1" data-s="190">tempor</i>
    </div>
    <div class="cam"><div class="pile" data-layout-allow-overlap data-layout-allow-overflow></div></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // A slanted word pile: words in mixed fonts drop in one at a time and stack into tilted rows, each row building upward,
    // like a wall of type rising from the bottom of the frame. The camera rises with the pile, then pulls back to see it whole.
    const pile = document.querySelector("#s50 .pile"), W = 740, GAP = 22, STEP = 0.32;
    function build() {
      const items = [...document.querySelectorAll("#s50-copy i")]; let x = -W / 2, y = 0, rowH = 0; const placed = [];
      items.forEach((it, i) => {
        const e = document.createElement("span"); e.className = "w f" + it.dataset.f; e.textContent = it.textContent; e.style.fontSize = it.dataset.s + "px"; pile.appendChild(e);
        const w = e.offsetWidth, h = +it.dataset.s * 0.8;
        if (x + w > W / 2) { y -= rowH + GAP; x = -W / 2; rowH = 0; }
        e.style.left = x + "px"; e.style.top = (y - h) + "px"; placed.push({ e, row: y }); x += w + 28; rowH = Math.max(rowH, h);
      });
      const top = y - rowH;
      placed.forEach((p, i) => {
        tl.fromTo(p.e, { y: -320, opacity: 0, rotation: (i % 2 ? 9 : -9) }, { y: 0, opacity: 1, rotation: 0, duration: 0.38, ease: "back.out(1.6)" }, 0.2 + i * STEP);
      });
      // camera: follow the growing pile upward, then pull back to the whole pile
      tl.fromTo(".cam", { y: 380, scale: 1.08 }, { y: -top * 0.5, scale: 1.0, duration: 0.2 + placed.length * STEP, ease: "power1.inOut", transformOrigin: "540px 1100px" }, 0);
      tl.to(".cam", { y: -top * 0.32 - 60, scale: 0.86, duration: 0.9, ease: "power3.inOut" }, 0.4 + placed.length * STEP);
      tl.to(placed.map(p => p.e).reverse(), { y: 500, opacity: 0, duration: 0.35, ease: "power2.in", stagger: 0.03 }, 5.3);
    }
    window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
    window.__hf.buildReady["s50"] = Promise.all([document.fonts.load("900 100px Inter"), document.fonts.load('400 100px "Archivo Black"'), document.fonts.load('italic 400 100px "Instrument Serif"')].map(p => p.catch(() => {}))).then(build);
    window.__timelines["s50"] = tl;
  </script>
</template>
