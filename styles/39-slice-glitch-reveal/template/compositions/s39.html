<template>
  <style>
    #s39 { position: absolute; inset: 0; overflow: hidden; background: var(--c4, #f4efe4); }
    #s39 .ln { position: absolute; left: 0; width: 1080px; height: 200px; }
    #s39 .sl { position: absolute; top: 0; height: 200px; overflow: hidden; }
    #s39 .sl b { position: absolute; top: 0; width: 1080px; text-align: center; font: 900 190px/200px Inter, sans-serif; letter-spacing: -0.03em; white-space: nowrap; }
    #s39 .sl b.c { color: var(--c2, #ff3b5c); mix-blend-mode: multiply; }
    #s39 .sl b.m { color: var(--c1, #0e0b1f); }
    #s39 .streak { position: absolute; top: -60px; width: 3px; height: 320px; background: #0e0b1f; opacity: 0; }
  </style>
  <div id="s39" data-composition-id="s39" data-width="1080" data-height="1920">
    <div class="ln" style="top:760px" data-layout-allow-overlap data-layout-allow-overflow>LOREM</div>
    <div class="ln" style="top:960px" data-layout-allow-overlap data-layout-allow-overflow>IPSUM</div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // The words are cut into thin vertical slices. Each slice drops/rises into place at its own moment, trailing a thin
    // black streak and a red ghost that catches up - a sliced, glitchy reveal. The exit slices them out the other way.
    const N = 22;
    let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    document.querySelectorAll("#s39 .ln").forEach((ln, li) => {
      const txt = ln.textContent; ln.textContent = "";
      for (let i = 0; i < N; i++) {
        const x0 = 90 + i * (900 / N), w = 900 / N + 1;
        const sl = document.createElement("div"); sl.className = "sl"; sl.style.left = x0 + "px"; sl.style.width = w + "px";
        const c = document.createElement("b"); c.className = "c"; c.textContent = txt; c.style.left = -x0 + "px";
        const m = document.createElement("b"); m.className = "m"; m.textContent = txt; m.style.left = -x0 + "px";
        sl.append(c, m); ln.appendChild(sl);
        const k = document.createElement("div"); k.className = "streak"; k.style.left = (x0 + w * rnd()) + "px"; ln.appendChild(k);
        const dir = rnd() < .5 ? -1 : 1, t = 0.2 + li * 0.35 + rnd() * 0.9, d = dir * (160 + rnd() * 140);
        tl.fromTo(m, { y: d }, { y: 0, duration: 0.42, ease: "expo.out" }, t);
        tl.fromTo(c, { y: d * 1.4, x: 10 }, { y: 0, x: 0, duration: 0.6, ease: "expo.out" }, t);
        tl.fromTo(k, { opacity: 0.9, scaleY: 1.2, y: d * 0.4 }, { opacity: 0, scaleY: 0.2, y: 0, duration: 0.5, ease: "power2.out" }, t);
        const te = 4.6 + li * 0.2 + rnd() * 0.6;
        tl.to([m, c], { y: -d * 1.3, duration: 0.35, ease: "expo.in", stagger: 0.04 }, te);
        tl.fromTo(k, { opacity: 0 }, { opacity: 0.8, duration: 0.1, yoyo: true, repeat: 1 }, te + 0.15);
      }
    });
    window.__timelines["s39"] = tl;
  </script>
</template>
