<!doctype html>
<html lang="en" data-resolution="portrait" data-composition-variables='[{"id": "footageSrc", "type": "string", "label": "Talking-head footage (path in assets/)", "default": "assets/room-corridor.mp4"}, {"id": "c1", "type": "color", "label": "Big wall words (lime)", "default": "#c8ff3c"}, {"id": "c2", "type": "color", "label": "Second big word (white)", "default": "#ffffff"}, {"id": "c3", "type": "color", "label": "Small serif lines (pink)", "default": "#ff5fc8"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>18 Wall Perspective Text</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #14101e; }
      #bg { position: absolute; inset: 0; background: #14101e; z-index: 0; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="bg"></div>
      <video id="footage" class="clip" src="assets/room-corridor.mp4" data-var-src="footageSrc" muted playsinline
        data-start="0" data-duration="5" data-track-index="1"
        style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;z-index:1"></video>
      <div id="wl1" data-composition-id="wl1" data-composition-src="compositions/wl1.html"
        data-start="0" data-duration="5" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:10"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
