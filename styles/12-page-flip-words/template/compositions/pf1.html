  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#pf1-book", { rotationX: 52, y: 260, scale: 0.8 }, { rotationX: 24, y: 0, scale: 1, duration: 0.7, ease: "expo.out" }, 0);
    tl.fromTo("#pf1-shadow", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.1);
    // FLIP: a page turns on the spine (0 → −180°). Faces swap exactly at 90° (explicit, no backface culling);
    // a shade darkens the page as it lifts and clears as it lands. Pages pile up on the left in turn order.
    function flip(i, t) {
      const p = `#pf1-p${i}`;
      tl.to(p, { keyframes: [{ rotationY: -90, duration: 0.24, ease: "power2.in" }, { rotationY: -180, duration: 0.3, ease: "power2.out" }] }, t);
      tl.set(`${p} .front`, { opacity: 0 }, t + 0.24); tl.set(`${p} .back`, { opacity: 1 }, t + 0.24);
      tl.fromTo(`${p} .shade`, { opacity: 0 }, { keyframes: [{ opacity: 0.8, duration: 0.24 }, { opacity: 0, duration: 0.3 }] }, t);
      tl.set(p, { zIndex: 20 + i }, t + 0.24);                 // once past the spine it lies on top of the left stack
    }
    [0, 1, 2, 3].forEach(i => tl.set(`#pf1-p${i} .back`, { opacity: 0 }, 0));
    flip(0, 1.0); flip(1, 1.85); flip(2, 2.7);
    tl.to("#pf1-book", { rotationX: 10, rotationZ: -3, duration: 3.2, ease: "sine.inOut" }, 0.7);   // slow tilt toward camera
    tl.to("#pf1-book", { y: 1300, rotationX: 70, duration: 0.45, ease: "power3.in" }, 3.95);
