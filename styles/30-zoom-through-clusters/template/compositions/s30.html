<template>
  <style>
    #s30 { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(ellipse 80% 55% at 50% 50%, #0d2a24 0%, #06110f 70%, #030707 100%); }
    #s30 .cl { position: absolute; left: 540px; top: 960px; width: 0; height: 0; }
    #s30 .w { position: absolute; white-space: nowrap; line-height: 1; font-family: Inter, sans-serif; font-weight: 900; letter-spacing: -0.03em; color: var(--c1, #ffffff); }
    #s30 .g { color: var(--c2, #c8ff3c); }
  </style>
  <div id="s30" data-composition-id="s30" data-width="1080" data-height="1920">
    <!-- clusters: each .w has data-x, data-y (px from centre), data-s (font size). data-target marks the word the camera dives into -->
    <div class="cl" data-layout-allow-overlap data-layout-allow-overflow>
      <div class="w" data-x="-170" data-y="-120" data-s="64">lorem</div><div class="w g" data-x="120" data-y="-125" data-s="70">ipsum</div>
      <div class="w" data-x="0" data-y="20" data-s="200">dolor</div><div class="w g" data-x="230" data-y="150" data-s="44" data-target>sit</div>
    </div>
    <div class="cl" data-layout-allow-overlap data-layout-allow-overflow>
      <div class="w g" data-x="-40" data-y="-150" data-s="230">sit</div><div class="w" data-x="-120" data-y="40" data-s="110">amet</div>
      <div class="w" data-x="190" data-y="45" data-s="56">con</div><div class="w" data-x="20" data-y="140" data-s="80">sectetur</div><div class="w g" data-x="-260" data-y="130" data-s="40" data-target>elit</div>
    </div>
    <div class="cl" data-layout-allow-overlap data-layout-allow-overflow>
      <div class="w g" data-x="0" data-y="-140" data-s="260">elit</div><div class="w" data-x="-150" data-y="40" data-s="70">sed do</div>
      <div class="w" data-x="170" data-y="40" data-s="70">eius</div><div class="w" data-x="0" data-y="160" data-s="150" data-target>mod</div>
    </div>
    <div class="cl" data-layout-allow-overlap data-layout-allow-overflow>
      <div class="w" data-x="0" data-y="-120" data-s="230">mod</div><div class="w g" data-x="0" data-y="60" data-s="140">tempor</div><div class="w" data-x="0" data-y="170" data-s="60">incididunt</div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // Zoom-through clusters: each cluster of mixed-size words builds, then the camera dives INTO one small word,
    // which becomes the big word of the next cluster.
    const CL = [...document.querySelectorAll("#s30 .cl")], HOLD = 1.05, DIVE = 0.42;
    CL.forEach(c => c.querySelectorAll(".w").forEach(w => { gsap.set(w, { xPercent: -50, yPercent: -50 }); w.style.left = w.dataset.x + "px"; w.style.top = w.dataset.y + "px"; w.style.fontSize = w.dataset.s + "px"; }));
    gsap.set(CL, { opacity: 0 });
    let t = 0.1;
    CL.forEach((c, i) => {
      const ws = [...c.querySelectorAll(".w")];
      tl.set(c, { opacity: 1 }, t);
      if (i === 0) tl.fromTo(ws, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.12 }, t);
      else tl.fromTo(ws.slice(1), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.1 }, t + 0.05);
      tl.fromTo(c, { scale: i ? 0.2 : 0.9 }, { scale: 1.06, duration: HOLD + (i ? DIVE : 0.3), ease: i ? "expo.out" : "power2.out" }, i ? t - DIVE : t);
      const tg = c.querySelector("[data-target]");
      if (tg && i < CL.length - 1) {
        const tx = +tg.dataset.x, ty = +tg.dataset.y, next = CL[i + 1];
        const T = t + HOLD + 0.35;
        tl.to(c, { scale: 12, x: -tx * 11, y: -ty * 11, duration: DIVE, ease: "power3.in" }, T);
        tl.to(c, { opacity: 0, filter: "blur(10px)", duration: 0.12, ease: "none" }, T + DIVE - 0.12);
        tl.fromTo(next, { filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, T + DIVE);
        t = T + DIVE;
      } else {
        tl.to(c.querySelectorAll(".w"), { y: "-=60", opacity: 0, duration: 0.35, ease: "power2.in", stagger: 0.06 }, t + HOLD + 0.4);
      }
    });
    window.__timelines["s30"] = tl;
  </script>
</template>
