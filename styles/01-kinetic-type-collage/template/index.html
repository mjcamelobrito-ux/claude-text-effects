<!doctype html>
<html lang="en" data-resolution="portrait" data-composition-variables='[{"id": "accent", "type": "color", "label": "Accent (green)", "default": "#1f6e50"}, {"id": "glow", "type": "color", "label": "Glow / teal", "default": "#3fc1aa"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>01 Kinetic Type Collage</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #d8d8d5; }
      #bg { position: absolute; inset: 0; background: #d8d8d5; z-index: 0; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="10.8" data-width="1080" data-height="1920">
      <div id="bg"></div>
      <div id="kc1" data-composition-id="kc1" data-composition-src="compositions/kc1.html"
        data-start="0" data-duration="2.2" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="kc2" data-composition-id="kc2" data-composition-src="compositions/kc2.html"
        data-start="2.2" data-duration="2.4" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:11"></div>
      <div id="kc3" data-composition-id="kc3" data-composition-src="compositions/kc3.html"
        data-start="4.6" data-duration="2.6" data-track-index="4" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:12"></div>
      <div id="kc4" data-composition-id="kc4" data-composition-src="compositions/kc4.html"
        data-start="7.2" data-duration="3.6" data-track-index="5" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:13"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
