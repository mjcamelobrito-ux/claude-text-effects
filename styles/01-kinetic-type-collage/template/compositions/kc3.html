  <script>
    const tl = gsap.timeline({ paused: true });

    const beats = [["#kc3-a", 0.05], ["#kc3-b", 0.35], ["#kc3-c", 0.6], ["#kc3-d", 1.0]];
    beats.forEach(([sel, t]) => {
